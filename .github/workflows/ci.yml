# CI — docs/18 §4. 신뢰 원천: windows job(실행 타깃), core job(크로스 플랫폼 순수부).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # rust-toolchain.toml 적용
      - run: cargo test --workspace

  windows:
    name: windows (build·test·예산)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo test --workspace
      - run: cargo build --release -p nexa-app
      # 동봉 플러그인은 별도 크레이트(워크스페이스 밖·wasm 타깃)라 위 test/build가
      # 건드리지 않는다 — 릴리스에서 처음 깨지는 일이 없도록 CI에서도 빌드한다.
      - run: rustup target add wasm32-unknown-unknown
      - name: 동봉 플러그인 빌드 검증 (samples/*-wasm — docs/18 §3-1)
        shell: pwsh
        run: pwsh scripts/build-plugins.ps1 -OutDir target/release/plugins -SkipDist
      - name: 예산 B2 — 단일 exe ≤ 10MB (docs/18 §6)
        shell: pwsh
        run: |
          $exe = "target/release/nexa-app.exe"
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Output "nexa-app.exe = $mb MB"
          if ((Get-Item $exe).Length -gt 10MB) { throw "예산 B2 초과: $mb MB > 10 MB" }
      - name: 예산 B3 — 임포트 DLL 화이트리스트 게이트 (docs/18 §6)
        shell: pwsh
        run: pwsh scripts/budget-b3.ps1 # 화이트리스트 단일 출처 — 로컬 push 전에도 동일 스크립트
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-app-win-x64
          path: target/release/nexa-app.exe

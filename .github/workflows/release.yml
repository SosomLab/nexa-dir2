# Release — docs/18 §5 (M5-2). 버전 태그 push → 게이트(test·B2·B3) 통과 시
# 포터블 단일 exe(DR-3)를 GitHub Release에 자동 첨부. 태그 규약 = `0.5.0`(v 접두사 허용).
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch: # 수동 실행 = 게이트+아티팩트만(Release 생성은 태그 push에서만)

permissions:
  contents: write # Release 생성·자산 업로드

jobs:
  release:
    name: windows (게이트 → Release 첨부)
    runs-on: windows-latest
    env:
      # 시크릿 미설정 시 빈 문자열 → choco push 단계는 건너뛴다(패킹까지만 수행).
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # rust-toolchain.toml 적용
      - run: cargo test --workspace
      - run: cargo build --release -p nexa-app
      - name: 예산 B2 — 단일 exe ≤ 10MB (docs/18 §6)
        shell: pwsh
        run: |
          $exe = "target/release/nexa-app.exe"
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Output "nexa-app.exe = $mb MB"
          if ((Get-Item $exe).Length -gt 10MB) { throw "예산 B2 초과: $mb MB > 10 MB" }
      - name: 예산 B3 — 임포트 DLL 화이트리스트 게이트 (docs/18 §6)
        shell: pwsh
        run: pwsh scripts/budget-b3.ps1
      - name: 배포 산출물 이름 — NexaDir-<버전>-win-x64.exe (포터블 단일 exe, DR-3)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") { $ver = "dev" }
          Copy-Item target/release/nexa-app.exe "NexaDir-$ver-win-x64.exe"
          Write-Output "산출물: NexaDir-$ver-win-x64.exe"
      - name: 설치형 exe 빌드 — Inno Setup (보조 채널, DR-3 개정 07-16)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") { $ver = "0.0.0" }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$ver /DExePath="$PWD\target\release\nexa-app.exe" installer\nexa.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 실패: $LASTEXITCODE" }
          Get-Item installer\out\NexaDir-Setup-*.exe | ForEach-Object {
            Write-Output "설치형: $($_.Name) = $([math]::Round($_.Length / 1MB, 2)) MB"
          }
      # ZIP 자산(docs/21 §5-1, 2026-07-31): 무서명(DR-3) exe는 브라우저의 SmartScreen
      # 다운로드 평판 필터에 차단되는 사례가 있다. zip으로 감싸면 그 단계를 피한다
      # (실행 시 경고는 남음 — MOTW가 압축 해제 시 전파되므로). winget·choco 매니페스트가
      # URL·체크섬으로 참조하는 원본 exe 자산은 **그대로 두고** zip을 덧붙이기만 한다.
      - name: ZIP 자산 추가 — 다운로드 필터 완화 (기존 exe 자산 유지)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          # here-string(@" ... "@)은 종료자가 컬럼 0이어야 해 YAML 블록 스칼라를 깨뜨린다.
          # 배열 + Set-Content로 같은 결과를 낸다(CRLF는 Set-Content가 붙인다).
          $notice = @(
            "Nexa Dir $ver — 실행 안내 / How to run"
            ""
            "이 빌드에는 코드 서명 인증서가 없습니다(DR-3 무서명 배포 방침)."
            "따라서 처음 실행할 때 Windows SmartScreen이 아래 경고를 표시합니다."
            ""
            '    "Windows의 PC 보호 — 알 수 없는 게시자"'
            ""
            "[추가 정보] > [실행]을 누르면 정상 실행됩니다."
            ""
            "무결성 확인(권장) — Release 페이지의 SHA256SUMS.txt 값과 대조하세요."
            ""
            "    PowerShell> Get-FileHash .\NexaDir-$ver-win-x64.exe -Algorithm SHA256"
            ""
            "배포처: https://github.com/SosomLab/nexa-dir2/releases"
            "문의:   kiros33@gmail.com"
            ""
            "--------------------------------------------------------------------"
            "This build is not code-signed. Windows SmartScreen shows an"
            '"unknown publisher" warning on first run: [More info] > [Run anyway].'
            "Verify the SHA-256 against SHA256SUMS.txt on the release page."
          )
          Set-Content -Path README.txt -Value $notice -Encoding utf8BOM
          Compress-Archive -Path "NexaDir-$ver-win-x64.exe", README.txt `
            -DestinationPath "NexaDir-$ver-win-x64.zip" -CompressionLevel Optimal
          Compress-Archive -Path "installer\out\NexaDir-Setup-$ver.exe", README.txt `
            -DestinationPath "NexaDir-Setup-$ver.zip" -CompressionLevel Optimal
          Get-Item NexaDir-*.zip | ForEach-Object {
            Write-Output "zip: $($_.Name) = $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: SHA256SUMS.txt — 자산 4종 체크섬 (README.txt 무결성 확인 안내의 대조본)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $assets = @(
            "NexaDir-$ver-win-x64.exe"
            "NexaDir-$ver-win-x64.zip"
            "installer\out\NexaDir-Setup-$ver.exe"
            "NexaDir-Setup-$ver.zip"
          )
          $lines = foreach ($a in $assets) {
            $h = (Get-FileHash -Algorithm SHA256 $a).Hash.ToLower()
            "$h  $(Split-Path $a -Leaf)"
          }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt | ForEach-Object { Write-Output $_ }

      - name: Chocolatey nupkg 팩 — 버전·체크섬 주입 (2패키지, docs/21 §7)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          # nupkg는 바이너리 미동봉 — 설치 시 각자의 Release 자산을 내려받는다.
          # nexa-dir = 설치형 exe · nexa-dir.portable = 포터블 단일 exe.
          $pkgs = @(
            @{ Id = "nexa-dir";          Asset = "installer\out\NexaDir-Setup-$ver.exe" }
            @{ Id = "nexa-dir.portable"; Asset = "NexaDir-$ver-win-x64.exe" }
          )
          foreach ($p in $pkgs) {
            $sha = (Get-FileHash -Algorithm SHA256 (Get-Item $p.Asset)).Hash.ToLower()
            Write-Output "$($p.Id): $($p.Asset) SHA-256 = $sha"
            $ps1 = "packaging\chocolatey\$($p.Id)\tools\chocolateyinstall.ps1"
            (Get-Content $ps1 -Raw).Replace("{{VERSION}}", $ver).Replace("{{CHECKSUM64}}", $sha) |
              Set-Content $ps1 -NoNewline
            choco pack "packaging\chocolatey\$($p.Id)\$($p.Id).nuspec" --version $ver `
              --outputdirectory packaging\chocolatey\out
            if ($LASTEXITCODE -ne 0) { throw "choco pack 실패($($p.Id)): $LASTEXITCODE" }
          }
          Get-Item packaging\chocolatey\out\*.nupkg | ForEach-Object { Write-Output "nupkg: $($_.Name)" }

      # choco push 스위치(사용자 요청 07-21): 저장소 변수 CHOCO_PUSH='true'일 때만 게시.
      # 미설정(기본) = GitHub Release까지만 — 모더레이션 승인 대기 중 이중 큐 회피.
      # 승인 후 Settings > Variables에 CHOCO_PUSH=true 등록으로 재개(코드 무변).
      - name: Chocolatey 커뮤니티 저장소 push (CHOCO_PUSH 변수 + 시크릿 있을 때만)
        if: github.ref_type == 'tag' && env.CHOCO_API_KEY != '' && vars.CHOCO_PUSH == 'true'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          foreach ($id in @("nexa-dir", "nexa-dir.portable")) {
            choco push "packaging\chocolatey\out\$id.$ver.nupkg" `
              --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
            if ($LASTEXITCODE -ne 0) { throw "choco push 실패($id): $LASTEXITCODE" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: NexaDir-win-x64
          path: |
            NexaDir-*-win-x64.exe
            installer/out/NexaDir-Setup-*.exe
            NexaDir-*.zip
            SHA256SUMS.txt
            packaging/chocolatey/out/*.nupkg
      - name: GitHub Release 생성·자산 첨부 (태그 push에서만 — exe 2 + zip 2 + 체크섬)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NexaDir-*-win-x64.exe
            installer/out/NexaDir-Setup-*.exe
            NexaDir-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
